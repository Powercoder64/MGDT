# COCO Captions, Karpathy split; CIDEr-D on the Karpathy test split (beam 3, at most 20 words).
task: captioning
seed: 0
deterministic: false
output_dir: outputs/coco_captions

data:
  karpathy_json: data/coco/dataset_coco.json   # Karpathy split file
  image_root: data/coco/images                 # contains train2014/ and val2014/
  img_size: 224
  crop_scale: [0.5, 1.0]
  max_words: 20
  min_word_count: 5
  eval_split: test
  num_workers: 8
  test:
    beam_size: 3
    max_words: 20

model:
  name: mgdt_captioner
  pretrained: outputs/imagenet1k/final.pth
  pretrained_ema: true
  d_model: 1024
  depth: 10
  num_heads: 16
  mlp_ratio: 4.0
  dropout: 0.1
  max_len: 22
  encoder:
    img_size: 224
    patch_size: 16
    embed_dim: 768
    depth: 12
    num_heads: 12
    mlp_ratio: 4.0
    drop_rate: 0.0
    drop_path_rate: 0.1
    grad_checkpointing: false
    mixer:
      type: mgdt
      k: 16
      local_radius: 1
      levels: 1
      coarsening: hem
      coarsen_factor: 2
      hem_rounds: 4
      pre_smooth: 1
      post_smooth: 1
      coarse_steps: 2
      tau: 0.5
      normalization: degree
      conductance: exp
      threshold: null
      kappa_init: 5.0
      kappa_mode: head
      kappa_warmup: true
      kappa_warmup_start: 0.1
      similarity: shared
      shared_dim: 64
      metric: l2
      clip_norm: 5.0
      drop_threshold: 1.0e-4

optim:
  lr: 1.0e-4
  weight_decay: 0.01
  betas: [0.9, 0.999]

schedule:
  epochs: 30
  warmup_epochs: 5
  kappa_warmup_epochs: 5
  scheduler: cosine
  min_lr: 1.0e-6

train:
  batch_size: 512
  eval_batch_size: 128
  accum_steps: 1
  amp: fp16
  eval_interval: 5
  log_interval: 50
