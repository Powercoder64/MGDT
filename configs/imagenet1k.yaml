# ImageNet-1K classification, trained from scratch (224x224, single-crop Top-1).
task: imagenet
seed: 0
deterministic: false
output_dir: outputs/imagenet1k

data:
  root: data/imagenet            # contains train/<wnid>/*.JPEG and val/<wnid>/*.JPEG
  train_split: train
  val_split: val
  img_size: 224
  crop_pct: 0.875
  num_workers: 10
  train_aug:
    rand_augment: rand-m9-mstd0.5-inc1
    random_erasing: 0.25
    color_jitter: 0.4
    interpolation: bicubic
  mixup:
    mixup_alpha: 0.8
    cutmix_alpha: 1.0
    switch_prob: 0.5
    prob: 1.0

model:
  name: mgdt_vit
  img_size: 224
  patch_size: 16
  num_classes: 1000
  embed_dim: 768
  depth: 12
  num_heads: 12
  mlp_ratio: 4.0
  drop_rate: 0.0
  drop_path_rate: 0.1
  grad_checkpointing: false
  mixer:
    type: mgdt
    k: 16
    local_radius: 1
    levels: 1
    coarsening: hem
    coarsen_factor: 2
    hem_rounds: 4
    pre_smooth: 1
    post_smooth: 1
    coarse_steps: 2
    tau: 0.5
    normalization: degree
    conductance: exp
    threshold: null
    kappa_init: 5.0
    kappa_mode: head
    kappa_warmup: true
    kappa_warmup_start: 0.1
    similarity: key
    metric: l2
    clip_norm: 5.0
    drop_threshold: 1.0e-4

optim:
  lr: 1.0e-3
  weight_decay: 0.05
  betas: [0.9, 0.999]

schedule:
  epochs: 300
  warmup_epochs: 20
  kappa_warmup_epochs: 5
  scheduler: cosine
  min_lr: 1.0e-5

train:
  batch_size: 1024          # global batch size
  eval_batch_size: 256
  accum_steps: 1
  amp: fp16
  label_smoothing: 0.1
  ema:
    enabled: true
    decay: 0.99996
  eval_interval: 1
  log_interval: 50
