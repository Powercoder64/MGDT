# ADE20K semantic segmentation (150 classes), single-scale sliding-window mIoU on the validation split.
task: segmentation
seed: 0
deterministic: false
output_dir: outputs/ade20k

data:
  dataset: ade20k
  root: data/ADEChallengeData2016     # images/{training,validation}, annotations/{training,validation}
  train_split: training
  val_split: validation
  scale: [2048, 512]
  ratio_range: [0.5, 2.0]
  crop_size: [512, 512]
  cat_max_ratio: 0.75
  num_workers: 8
  test:
    mode: slide
    scale: [2048, 512]
    crop_size: [512, 512]
    stride: [341, 341]
    boundary_tolerance: 3

model:
  name: mgdt_segmenter
  pretrained: outputs/imagenet1k/final.pth
  pretrained_ema: true
  out_indices: [3, 5, 7, 11]
  decoder_channels: 256
  fuse_kernel: 1
  pool_scales: [1, 2, 3, 6]
  dropout: 0.1
  backbone:
    img_size: 224                     # resolution of the initialising checkpoint; position embeddings are resized
    patch_size: 16
    embed_dim: 768
    depth: 12
    num_heads: 12
    mlp_ratio: 4.0
    drop_rate: 0.0
    drop_path_rate: 0.1
    grad_checkpointing: false
    mixer:
      type: mgdt
      k: 16
      local_radius: 1
      levels: 1
      coarsening: hem
      coarsen_factor: 2
      hem_rounds: 4
      pre_smooth: 1
      post_smooth: 1
      coarse_steps: 2
      tau: 0.5
      normalization: degree
      conductance: exp
      threshold: null
      kappa_init: 5.0
      kappa_mode: head
      kappa_warmup: true
      kappa_warmup_start: 0.1
      similarity: key
      metric: l2
      clip_norm: 5.0
      drop_threshold: 1.0e-4

optim:
  lr: 6.0e-5
  weight_decay: 0.01
  betas: [0.9, 0.999]

schedule:
  iters: 160000
  warmup_iters: 1500
  kappa_warmup_frac: 0.05
  scheduler: poly
  power: 1.0
  min_lr: 0.0

train:
  batch_size: 16
  accum_steps: 1
  amp: fp16
  eval_interval_iters: 16000
  ckpt_interval_iters: 4000
  log_interval: 50
